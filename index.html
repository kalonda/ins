<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vodafone Foundation - Nyarugusu Camp INS Inventory & Activities</title>
  <meta name="description" content="Offline-first multi-center inventory management and educational activities tracker for Vodafone Foundation Instant Network Schools in Nyarugusu Camp.">
  <meta name="theme-color" content="#e60000">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%23e60000'/><text x='50' y='65' font-size='45' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'>VF</text></svg>">
</head>
<body>

  <div class="app-container">
    <!-- Sidebar Navigation -->
    <aside class="sidebar" id="app-sidebar">
      <div class="sidebar-header">
        <div class="brand-badge">VF</div>
        <div class="brand-text">
          <h1>Vodafone Foundation</h1>
          <p>INS - Nyarugusu Camp</p>
        </div>
        <button class="sidebar-collapse-toggle" id="sidebar-collapse-btn" title="Collapse / Hide Sidebar" aria-label="Collapse Sidebar">
          <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"></path></svg>
        </button>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-title">Overview</div>
        <button class="nav-item active" data-view="dashboard">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
          <span>Center Dashboard</span>
        </button>

        <div class="nav-section-title">Activities & Sessions</div>
        <button class="nav-item" data-view="teaching">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
          <span>Classroom Teaching</span>
        </button>

        <button class="nav-item" data-view="teacher_prep">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
          <span>Teacher Prep (Milliweb)</span>
        </button>

        <button class="nav-item" data-view="research">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
          <span>Student Research</span>
        </button>

        <button class="nav-item" data-view="community">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
          <span>Community Access</span>
        </button>

        <div class="nav-section-title">Hardware & Devices</div>
        <button class="nav-item" data-view="inventory">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
          <span>Device Registry (SN)</span>
        </button>

        <button class="nav-item" data-view="withdrawals">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
          <span>Withdrawals & Charging</span>
        </button>

        <button class="nav-item" data-view="incidents">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
          <span>Incidents & Repair</span>
        </button>

        <div class="nav-section-title">Administration</div>
        <button class="nav-item" data-view="centers">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
          <span>Schools & Coaches</span>
        </button>

        <button class="nav-item" data-view="users" id="nav-users-item">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
          <span>User Management</span>
        </button>

        <button class="nav-item" data-view="reports">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
          <span>Official Reports</span>
        </button>

        <button class="nav-item" data-view="settings" id="nav-settings-item">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
          <span>Sync & Settings</span>
        </button>
      </nav>

      <div id="sidebar-profile-container" class="sidebar-profile-card">
        <!-- Rendered dynamically -->
      </div>

      <div class="sidebar-footer">
        <small style="color: var(--vf-slate-400); display: block; font-size: 0.72rem;">
          Vodafone Foundation &copy; 2026<br>
          Nyarugusu Camp Educational Network
        </small>
      </div>
    </aside>

    <!-- Mobile Sidebar Backdrop -->
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <!-- Main Content Area -->
    <main class="main-wrapper">
      <!-- Top Header -->
      <header class="top-header">
        <div class="header-left">
          <button class="menu-toggle" id="mobile-menu-toggle" title="Toggle Sidebar" aria-label="Toggle navigation">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
          </button>
          
          <div class="center-selector-box">
            <label for="global-center-select" id="global-center-label">School / Center:</label>
            <select class="center-select" id="global-center-select">
              <option value="all">Loading schools...</option>
            </select>
          </div>
        </div>

        <div class="header-right">
          <!-- Logged in User Indicator -->
          <div id="header-user-profile"></div>

          <!-- Sync / Offline Status Pill -->
          <div class="sync-status-pill online" id="global-sync-pill" title="Click to view Sync Settings">
            <span class="status-dot"></span>
            <span>Checking sync...</span>
          </div>
        </div>
      </header>

      <!-- Main Body Container -->
      <section class="content-area">
        <div id="main-content-view">
          <!-- Dynamic component views render here -->
        </div>
      </section>
    </main>
  </div>

  <!-- Dedicated Authentication Gateway Viewport -->
  <div id="auth-gateway-container" style="display: none;"></div>

  <!-- Global Modal Container -->
  <div class="modal-backdrop" id="global-modal-backdrop">
    <div class="modal-content" id="global-modal-content">
      <!-- Dynamic modal forms render here -->
    </div>
  </div>

  <!-- Dedicated Centered Confirmation Modal Dialog -->
  <div class="confirm-modal-backdrop" id="global-confirm-backdrop">
    <div class="confirm-modal-box" id="global-confirm-box">
      <!-- Rendered dynamically by window.app.confirmDialog -->
    </div>
  </div>

  <!-- Interactive Avatar Popover Menu Backdrop -->
  <div class="avatar-menu-backdrop" id="avatar-menu-backdrop" onclick="window.app.closeAvatarMenu(event)">
    <div class="avatar-menu-popover" id="avatar-menu-popover" onclick="event.stopPropagation()">
      <!-- Rendered dynamically by window.app.renderAvatarMenu -->
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- JavaScript Modules -->
  <script src="js/sample-data.js"></script>
  <script src="js/db.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/components/dashboard.js"></script>
  <script src="js/components/inventory.js"></script>
  <script src="js/components/teaching.js"></script>
  <script src="js/components/teacher-prep.js"></script>
  <script src="js/components/research.js"></script>
  <script src="js/components/community.js"></script>
  <script src="js/components/checkout.js"></script>
  <script src="js/components/incidents.js"></script>
  <script src="js/components/centers.js"></script>
  <script src="js/components/users.js"></script>
  <script src="js/components/reports.js"></script>
  <script src="js/components/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
